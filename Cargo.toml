[package]
name = "wasm-crypto"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ['cdylib']

[dependencies]
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.12.0", default-features = false }
coins-bip32 = "0.13.1"

[dev-dependencies]
wasm-crypto-rs = { path = "./host-wrappers/rust" }

[[test]]
name = "integration"

[workspace]
members = [
  "host-wrappers/rust"
]
